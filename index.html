<style>
  :root{
    --tar:#0d0c0f; --tar-2:#16151a; --tar-3:#1e1d24;

    --rust:#b4553a; --moss:#6d7f5b; --line:#2c2a33;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--tar);color:var(--bone);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--bone);text-decoration:none;border-bottom:1px solid rgba(180,85,58,.55)}
  a:hover{color:#fff;border-bottom-color:var(--rust)}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
  .wrap{max-width:1560px;margin:0 auto;padding:26px 20px 70px}

  .eyebrow{font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
  h1{font-size:clamp(28px,5vw,44px);font-weight:400;margin:10px 0 8px}
  .lede{font-size:15px;color:#b9b2a4;max-width:70ch;margin:0 0 4px}

  .bar{position:sticky;top:0;z-index:20;background:rgba(13,12,15,.94);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin:20px -20px 0;padding:11px 20px}
  .bar-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

  .meter{display:flex;align-items:center;gap:10px;min-width:230px}
  .meter-num{font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;white-space:nowrap}
  .meter-num.ok{color:var(--moss)}
  .track{flex:1;height:4px;background:var(--line);position:relative}
  .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--rust);transition:width .25s ease}
  .fill.ok{background:var(--moss)}

  input[type=search]{flex:1;min-width:160px;background:var(--tar-2);border:1px solid var(--line);
    color:var(--bone);padding:7px 10px;font:14px/1.3 inherit;border-radius:2px}
  input[type=search]::placeholder{color:#5f5a52}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip,.ghost{background:none;border:1px solid var(--line);color:var(--bone-dim);
    padding:5px 11px;border-radius:2px;cursor:pointer;
    font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
  .chip:hover,.ghost:hover{color:var(--bone);border-color:#413e4a}
  .chip[aria-pressed=true]{background:var(--rust);border-color:var(--rust);color:#120e0c}
  .ghost:hover{color:var(--rust);border-color:var(--rust)}
  .toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--bone-dim);user-select:none}
  .toggle:hover{color:var(--bone)}

  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:94px;z-index:10;background:var(--tar-3);
    font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;
    color:var(--bone-dim);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:var(--tar-2)}
  .c-chk{width:44px;text-align:center}
  .c-no{width:44px}
  .c-img{width:78px}
  .c-name{width:200px}
  .c-comp{width:118px}
  .c-type{width:100px}
  .c-loc{width:300px}

  input[type=checkbox]{appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:2px 0 0;
    border:1px solid #4a4653;background:var(--tar-2);border-radius:2px;cursor:pointer;position:relative}
  input[type=checkbox]:hover{border-color:var(--rust)}
  input[type=checkbox]:checked{background:var(--moss);border-color:var(--moss)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:9px;
    border:solid #10120d;border-width:0 2px 2px 0;transform:rotate(43deg)}

  .no{font:600 12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#5f5a52}
  .thumb{width:56px;height:56px;object-fit:contain;display:block}
  .noimg{width:56px;height:56px;border:1px dashed var(--line);border-radius:2px;display:flex;

  .name{font-size:16px}
  .meta{font:600 11px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
  .tag{display:inline-block;padding:3px 8px;border-radius:2px;border:1px solid;
    font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
  .t-Support{color:#c8b98a;border-color:#4d452f}
  .t-Combat{color:#d18d78;border-color:#5b3a2e}
  .t-Infusion{color:#8fa9c4;border-color:#33455a}
  .t-Ability{color:#a992c2;border-color:#453258}
  .t-Fragile{color:#9ab0a0;border-color:#3b4a40}
  .miss{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:2px;
    background:#4a1f14;color:#f0b49c;border:1px solid #7d3421;
    font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
  .fx-head{margin:0 0 5px}
  .fx-lv{margin:0;padding:0;list-style:none}
  .fx-lv li{font-size:13.5px;color:#b9b2a4;padding-left:14px;position:relative}
  .fx-lv li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:#4a4653}
  .loc{font-size:13.5px;color:#b9b2a4}
  tr.done td{opacity:.42}
  tr.done .name{text-decoration:line-through;text-decoration-color:var(--bone-dim)}
  tr.done td:first-child{opacity:1}

  .empty{padding:50px 12px;text-align:center;color:var(--bone-dim)}
  .note{margin-top:14px;padding:10px 12px;border:1px solid #5b3a2e;background:#1c1310;
    color:#d18d78;font-size:13px;border-radius:2px}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    font-size:13px;color:var(--bone-dim);max-width:80ch}
  .hide{display:none}
  @media (max-width:960px){
    thead{display:none}
    tbody tr{display:grid;grid-template-columns:44px 78px 1fr;gap:0 10px;padding:14px 0;border-bottom:1px solid var(--line)}
    tbody td{border:0;padding:0}
    .c-chk{grid-row:1/3}
    .c-no{display:none}
    .c-img{grid-row:1/3}
    .c-name{grid-column:3}
    .c-comp,.c-type{grid-column:3;display:inline-block;margin-top:6px;margin-right:8px;width:auto}
    .c-fx,.c-loc{grid-column:1/4;width:auto;margin-top:10px}
    thead th{top:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- storage ---------- */
const KEY = "ms2_tarstones_v2", LKEY = "ms2_tarstones_lang";
let storageOK = true, state = {};
try{
  state = JSON.parse(localStorage.getItem(KEY) || "{}");
  localStorage.setItem(KEY, JSON.stringify(state));
}catch(e){ storageOK = false; state = {}; }
function save(){ if(storageOK){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ storageOK=false; } } }

let lang = "en";
try{
  const stored = localStorage.getItem(LKEY);
  if(stored === "ru" || stored === "en") lang = stored;
  else if((navigator.language||"").slice(0,2).toLowerCase() === "ru") lang = "ru";
}catch(e){}

/* ---------- render ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tbody = document.getElementById("rows");
const MISS = {en:"MISSABLE", ru:"\u041c\u041e\u0416\u041d\u041e \u041f\u0420\u041e\u041f\u0423\u0421\u0422\u0418\u0422\u042c"};

tbody.innerHTML = DATA.map((r,idx)=>{
  const on = !!state[r.n];
  const src = r.i ? (r.i.startsWith("http") ? r.i : IMG + r.i) : "";
  const img = src
    ? `<a href="${WIKI}${r.u}" target="_blank" rel="noopener" style="border:0"><img class="thumb" src="${src}" alt="${esc(r.n)}" loading="lazy"></a>`
    : `<span class="noimg">NO&nbsp;IMG</span>`;
  return `<tr data-i="${idx}" class="${on?"done":""}">
    <td class="c-chk"><input type="checkbox" data-name="${esc(r.n)}" ${on?"checked":""} aria-label="${esc(r.n)}"></td>
    <td class="c-no"><span class="no">${r.no}</span></td>
    <td class="c-img">${img}</td>
    <td class="c-name"><a class="name" href="${WIKI}${r.u}" target="_blank" rel="noopener">${esc(r.n)}</a>${r.m?`<br><span class="miss" data-miss></span>`:""}</td>
    <td class="c-comp"><span class="meta">${esc(r.c)}</span></td>
    <td class="c-type"><span class="tag t-${r.t}">${r.t}</span></td>
    <td class="c-fx"><p class="fx-head">${esc(r.d)}</p><ul class="fx-lv">${r.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></td>
    <td class="c-loc"><span class="loc" data-loc></span></td>
  </tr>`;
}).join("");

  document.getElementById("q").placeholder = t.search;
  document.getElementById("lblHide").textContent = t.hide;
  document.getElementById("reset").textContent = t.reset;
  document.getElementById("empty").textContent = t.empty;
  document.getElementById("hImg").textContent = t.img;
  document.getElementById("hName").textContent = t.name;
  document.getElementById("hComp").textContent = t.comp;
  document.getElementById("hType").textContent = t.type;
  document.getElementById("hFx").textContent = t.fx;
  document.getElementById("hLoc").textContent = t.loc;
  document.getElementById("foot").innerHTML = t.foot;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-miss]").forEach(el=>{ el.textContent = MISS[lang]; });
  locEls.forEach((el,i)=>{ el.textContent = lang==="ru" ? DATA[i].pr : DATA[i].pe; });
  const w = document.getElementById("warn");
  w.textContent = t.warn; w.classList.toggle("hide", storageOK);
  buildHay(); apply();
}

let haystack = [];
function buildHay(){
  haystack = DATA.map(r => (r.n+" "+r.c+" "+r.t+" "+r.d+" "+r.l.join(" ")+" "+r.pe+" "+r.pr).toLowerCase());
}

/* ---------- filters ---------- */
let fType="all", fComp="all", fQ="", hideDone=false;
function apply(){
  let shown = 0;
  rowsEls.forEach((tr,i)=>{
    const r = DATA[i], on = !!state[r.n];
    let ok = true;
    if(fType!=="all" && r.t!==fType) ok=false;
    if(ok && fComp!=="all" && r.c!==fComp) ok=false;
    if(ok && fQ && !haystack[i].includes(fQ)) ok=false;
    if(ok && hideDone && on) ok=false;
    tr.style.display = ok?"":"none";
    if(ok) shown++;
  });
  document.getElementById("empty").classList.toggle("hide", shown>0);
  meter();
}
function meter(){
  const base = DATA.filter(r=>r.t!=="Fragile");
  const frag = DATA.filter(r=>r.t==="Fragile");
  const dBase = base.filter(r=>state[r.n]).length;
  const dFrag = frag.filter(r=>state[r.n]).length;
  const all = dBase===base.length && dFrag===frag.length;
  const c = document.getElementById("count"), f = document.getElementById("fill");
  c.textContent = dBase + " / " + base.length + "  +  " + dFrag + " / " + frag.length + " fragile"
                + (all ? "  \u00b7  " + T[lang].ok : "");
  c.classList.toggle("ok", all);
  f.classList.toggle("ok", all);
  f.style.width = ((dBase+dFrag)/DATA.length*100) + "%";
}

tbody.addEventListener("change", e=>{
  const cb = e.target.closest("input[type=checkbox]"); if(!cb) return;
  if(cb.checked) state[cb.dataset.name]=1; else delete state[cb.dataset.name];
  cb.closest("tr").classList.toggle("done", cb.checked);
  save();
  if(hideDone) apply(); else meter();
});
document.getElementById("q").addEventListener("input", e=>{ fQ = e.target.value.trim().toLowerCase(); apply(); });
function chipGroup(id, fn){
  document.getElementById(id).addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true"); fn(b);
  });
}
chipGroup("typeChips", b=>{ fType=b.dataset.type; apply(); });
chipGroup("compChips", b=>{ fComp=b.dataset.comp; apply(); });
chipGroup("langChips", b=>{ lang=b.dataset.lang; try{localStorage.setItem(LKEY,lang);}catch(e){} paintLang(); });
document.getElementById("hideDone").addEventListener("change", e=>{ hideDone=e.target.checked; apply(); });
document.getElementById("reset").addEventListener("click", ()=>{
  if(!confirm(T[lang].confirm)) return;
  state = {}; save();
  tbody.querySelectorAll("input[type=checkbox]").forEach(cb=>{ cb.checked=false; cb.closest("tr").classList.remove("done"); });
  apply();
});

document.querySelectorAll("#langChips .chip").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
paintLang();
</script>
</body>
</html>
